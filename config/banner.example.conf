# claude-code-backup banner configuration
#
# Copy this file to: $HOME/.claude-backup/banner.conf
# It is sourced as shell, so use KEY=value lines only (no spaces around "=").
# See docs/banner.md for a full explanation of every option.

# Master switch. Set to false to silence the banner entirely.
BANNER_ENABLED=true

# Which segments to show.
BANNER_SHOW_GIT=true
BANNER_SHOW_ENV=true
BANNER_SHOW_BACKUP_STATUS=true
BANNER_SHOW_MCP_STATUS=true
BANNER_SHOW_SECRET_WARNING=true

# Layout style. Currently only "compact" is implemented.
BANNER_STYLE=compact

# Project name shown on the left. With AUTO=true the git repo (or directory)
# name is used; set AUTO=false and provide BANNER_PROJECT_NAME to override.
BANNER_PROJECT_NAME_AUTO=true
BANNER_PROJECT_NAME=

# Environment label (prod/stage/dev/...). With AUTO=true it is detected from
# $CLAUDE_ENV/$ENV/$APP_ENV/$NODE_ENV, kubectl context, git branch, then path.
BANNER_ENV_AUTO=true
BANNER_ENV=

# Backups older than this many hours are flagged with a warning glyph.
BANNER_MAX_BACKUP_AGE_HOURS=24
